<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate QR codes with custom colors and logos">
    <meta name="author" content="Agent-Lumi">
    <title>QR Code Generator | Made by Agent-Lumi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo"><span>📱</span></div>
            <h1>QR Code Generator</h1>
            <p>Generate QR codes with custom colors and logos</p>
        </header>
        <main>
            <div class="tool-box">
                <!-- QR Templates --n                <div class="qr-templates">
                    <label>🎯 Quick Templates:</label>
                    <div class="template-buttons">
                        <button type="button" class="template-btn" data-template="url" title="Standard URL">🔗 URL</button>
                        <button type="button" class="template-btn" data-template="wifi" title="WiFi Connection">📶 WiFi</button>
                        <button type="button" class="template-btn" data-template="vcard" title="Contact Card">👤 vCard</button>
                        <button type="button" class="template-btn" data-template="email" title="Send Email">📧 Email</button>
                        <button type="button" class="template-btn" data-template="sms" title="Send SMS">💬 SMS</button>
                        <button type="button" class="template-btn" data-template="phone" title="Call Number">📞 Phone</button>
                    </div>
                </div>
                
                <!-- Template Configuration Panel -->
                <div id="templateConfigPanel" class="template-config hidden">
                    <div class="config-header">
                        <span id="templateTitle">Template Configuration</span>
                        <button type="button" class="close-config" onclick="closeTemplateConfig()">×</button>
                    </div>
                    <div id="templateFields" class="template-fields">
                        <!-- Dynamic fields will be inserted here -->
                    </div>
                </div>
                
                <input type="text" id="qrText" placeholder="Enter URL or text..." value="https://github.com/Agent-Lumi">
                <div class="options">
                    <div class="option">
                        <label>Foreground Color:</label>
                        <input type="color" id="fgColor" value="#6f42c1">
                    </div>
                    <div class="option">
                        <label>Background Color:</label>
                        <input type="color" id="bgColor" value="#ffffff">
                    </div>
                    <div class="option">
                        <label>QR Size:</label>
                        <input type="range" id="qrSize" min="128" max="512" value="256">
                        <span id="sizeValue">256px</span>
                    </div>
                </div>
                
                <!-- Logo Upload Section -->
                <div class="logo-section">
                    <label class="logo-label">🎨 Add Logo (Optional)</label>
                    <div class="logo-upload">
                        <input type="file" id="logoInput" accept="image/*" style="display: none;">
                        <button type="button" onclick="document.getElementById('logoInput').click()" class="upload-btn">
                            📁 Choose Logo
                        </button>
                        <span id="logoFileName" class="file-name">No file selected</span>
                    </div>
                    <div id="logoPreview" class="logo-preview"></div>
                    
                    <div class="logo-size-control" id="logoSizeControl" style="display: none;">
                        <label>Logo Size:</label>
                        <div class="size-options">
                            <button type="button" class="size-btn active" data-size="small">Small</button>
                            <button type="button" class="size-btn" data-size="medium">Medium</button>
                            <button type="button" class="size-btn" data-size="large">Large</button>
                        </div>
                    </div>
                </div>
                
                <button onclick="generateQR()">Generate QR Code</button>
                
                <div id="qrOutput"></div>
                
                <div id="downloadSection" style="display: none;">
                    <button onclick="downloadQR()" class="secondary">📥 Download PNG</button>
                    <button onclick="shareQR()" class="secondary">🔗 Share</button>
                </div>
                
                <!-- QR Code History -->
                <div id="historyPanel" class="history-panel hidden">
                    <div class="history-header">
                        <h3>📚 Recent QR Codes</h3>
                        <button id="clearHistoryBtn" class="history-clear" title="Clear all history">Clear All</button>
                    </div>
                    <div id="qrHistory" class="history-list">
                        <p class="history-empty">No saved QR codes yet. Generate one to save it here!</p>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <p>Made with 💡 by <a href="https://github.com/Agent-Lumi" target="_blank">Agent-Lumi</a> for <a href="https://github.com/shalkith" target="_blank">@shalkith</a></p>
            <p><a href="https://github.com/Agent-Lumi/qr-code-generator" target="_blank">View on GitHub →</a></p>
        </footer>
    </div>
    
    <!-- Theme Toggle Button -->
    <button id="themeToggle" class="theme-toggle" title="Toggle Light/Dark Theme">
        <span id="themeIcon">🌙</span>
    </button>
    
    <!-- History Toggle Button -->
    <button id="historyToggle" class="history-toggle" title="Toggle History Panel">
        <span>📚</span>
    </button>
    
    <!-- Templates Toggle Button -->
    <button id="templatesToggle" class="templates-toggle" title="Quick QR Templates">
        <span>🎯</span>
    </button>
    
    <!-- Offline Indicator -->
    <div id="offlineIndicator" class="offline-indicator">⚠️ Offline</div>
    
    <!-- Local QR Code library - no CDN dependency -->
    <script src="qrcode.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
<script>
// Offline indicator
const offlineIndicator = document.createElement('div');
offlineIndicator.textContent = '⚠️ Offline';
offlineIndicator.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ff6b6b;color:white;text-align:center;padding:5px;display:none;';
document.body.appendChild(offlineIndicator);
window.addEventListener('online', () => offlineIndicator.style.display = 'none');
window.addEventListener('offline', () => offlineIndicator.style.display = 'block');
</script>
<script>
// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
        switch(e.key) {
            case 's': e.preventDefault(); console.log('Save shortcut'); break;
            case 'r': e.preventDefault(); location.reload(); break;
            case 'f': e.preventDefault(); document.querySelector('input')?.focus(); break;
        }
    }
});
</script>
<style>
@media (max-width: 768px) {
    .container { padding: 10px; }
    h1 { font-size: 1.5rem; }
    button { width: 100%; margin: 5px 0; }
}
</style>
<script>
// Offline indicator
const offlineIndicator = document.createElement('div');
offlineIndicator.textContent = '⚠️ Offline';
offlineIndicator.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ff6b6b;color:white;text-align:center;padding:5px;display:none;';
document.body.appendChild(offlineIndicator);
window.addEventListener('online', () => offlineIndicator.style.display = 'none');
window.addEventListener('offline', () => offlineIndicator.style.display = 'block');
</script>
<script>
// Share functionality
const shareBtn = document.createElement('button');
shareBtn.textContent = '🔗 Share';
shareBtn.style.cssText = 'position:fixed;bottom:20px;right:20px;padding:10px 20px;background:#6f42c1;color:white;border:none;border-radius:20px;cursor:pointer;';
shareBtn.onclick = () => {
    if (navigator.share) {
        navigator.share({ title: document.title, url: location.href });
    } else {
        navigator.clipboard.writeText(location.href);
        shareBtn.textContent = '✅ Copied!';
        setTimeout(() => shareBtn.textContent = '🔗 Share', 2000);
    }
};
document.body.appendChild(shareBtn);
</script>
